      description: "\n    Cancel a purchase order.\n    \n    Cancellation is allowed
        only when:\n    - The order is in DRAFT or ORDERED status.\n    - No quantity
        has been received.\n    \n    A partially received or fully received order
        cannot be cancelled.\n            "
