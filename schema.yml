    post:
      operationId: v1_users_create
      description: "\n        Create a new user account.\n\n        Administrators
        can assign a role to the new user.\n\n        Supported roles:\n        -
        ADMIN\n        - STOCK_MANAGER\n        - SALES\n        - PURCHASER\n        -
        VIEWER\n\n        The password is securely hashed before being stored.\n        "
      summary: Create User
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
