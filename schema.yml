  /api/v1/purchasing/purchase-orders/{id}/place/:
    post:
      operationId: v1_purchasing_purchase_orders_place_create
      description: "\n    Transition a purchase order from DRAFT to ORDERED.\n    \n
        \   Business rules:\n    - The purchase order must be in DRAFT status.\n    -
        The supplier must be active.\n    - The warehouse must be active.\n    - The
        purchase order must contain at least one line.\n    \n    No stock movement
        is created when placing an order.\n            "
      summary: Place a purchase order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this purchase order.
        required: true
      tags:
      - Purchasing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderRead'
              examples:
                PlacedOrderResponse:
                  value:
                    id: 1
                    number: PO-A12B34C56D78
                    supplier: 1
                    supplier_name: Supplier Test
                    warehouse: 1
                    warehouse_name: Main Warehouse
                    status: ORDERED
                    ordered_at: '2026-11-08T10:00:00Z'
                    lines: []
                  summary: Placed order response
          description: ''
        '403':
          description: Insufficient permissions.
        '404':
          description: Purchase order not found.
        '409':
          description: Invalid transition or empty purchase order.
  /api/v1/purchasing/purchase-orders/{id}/receive/:
    post:
      operationId: v1_purchasing_purchase_orders_receive_create
      description: "\n    Register a goods receipt for a purchase order.\n    \n    Only
        ADMIN and STOCK_MANAGER roles can perform this operation.\n    \n    Business
        rules:\n    - The order must be ORDERED or PARTIALLY_RECEIVED.\n    - Each
        purchase order line must belong to the specified order.\n    - Received quantity
        must be positive.\n    - Total received quantity cannot exceed ordered quantity.\n
        \   - The stock is updated through the inventory service.\n    - A StockMovement
        with type RECEIPT is created.\n    - The same idempotency key and payload
        return the existing receipt.\n    - Reusing an idempotency key with a different
        payload returns HTTP 409.\n    \n    The operation is atomic: if one line
        fails validation, no stock or receipt\n    changes are committed.\n            "
      summary: Receive goods for a purchase order
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this purchase order.
        required: true
      tags:
      - Purchasing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveInput'
            examples:
              PartialReceipt:
                value:
                  idempotency_key: b0d9bdf5-6479-4a7c-93fb-1f92bce1f126
                  lines:
                  - purchase_order_line: 1
                    quantity: '10.000'
                summary: Partial receipt
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReceiveInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReceiveInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptRead'
              examples:
                CompleteReceiptResponse:
                  value:
                    id: 1
                    purchase_order: 1
                    purchase_order_number: PO-A12B34C56D78
                    idempotency_key: b0d9bdf5-6479-4a7c-93fb-1f92bce1f126
                    received_by: 2
                    lines:
                    - id: 1
                      purchase_order_line: 1
                      product_name: Product Test
                      product_sku: TEST-001
                      quantity: '10.000'
                  summary: Complete receipt response
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptRead'
          description: Existing receipt returned (idempotent replay).
        '400':
          description: Invalid request data.
        '403':
          description: Insufficient permissions.
        '404':
          description: Purchase order not found.
        '409':
          description: Invalid transition, over-receipt, or idempotency key conflict.
