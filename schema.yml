  /api/v1/users/:
    get:
      operationId: v1_users_list
      description: "\n        Retrieve a paginated list of user accounts registered
        in the system.\n\n        Only administrators can access this endpoint.\n
        \       "
      summary: List All Users
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
