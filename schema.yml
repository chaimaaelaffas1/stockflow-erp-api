openapi: 3.0.3
info:
  title: StockFlow ERP API
  version: 1.0.0
  description: "\n    REST API for managing an ERP inventory system.\n\n    Main modules:\n
    \   - Authentication and user management\n    - Customers and suppliers\n    -
    Product categories and products\n    - Inventory management\n    - Sales and purchases\n
    \   "
paths:
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: "\n    Log out the authenticated user by blacklisting their refresh
        token.\n\n    Request body:\n    - refresh: The refresh token to invalidate.\n\n
        \   Returns HTTP 204 when the token is successfully blacklisted.\n    Returns
        HTTP 400 if the refresh token is missing or invalid.\n    "
      summary: Logout User
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
                  description: The refresh token to blacklist.
              required:
              - refresh
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: Missing or invalid refresh token.
        '401':
          description: Authentication required.
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: "\n    Retrieve the profile information of the currently authenticated
        user.\n\n    The response contains the current user's account information,\n
        \   including their assigned role.\n    "
      summary: Retrieve Current User Profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: "\n    Authenticate a user using their email and password.\n\n
        \   If the credentials are valid, the API returns an access token\n    and
        a refresh token.\n\n    The access token must be included in the Authorization
        header\n    when accessing protected endpoints.\n\n    Only active users are
        allowed to authenticate.\n    "
      summary: Obtain JWT Tokens
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: "\n        Generate a new access token using a valid refresh token.\n\n
        \       Request body:\n        - refresh: A valid JWT refresh token.\n\n        If
        refresh token rotation is enabled, a new refresh token\n        may also be
        returned.\n\n        Returns HTTP 401 if the refresh token is invalid,\n        expired,
        or blacklisted.\n        "
      summary: Refresh Access Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/catalog/categories/:
    get:
      operationId: v1_catalog_categories_list
      description: "\n        Retrieve a list of all product categories.\n\n        Supports
        searching categories by name.\n\n        All authenticated and active users
        can access this endpoint.\n        "
      summary: List Product Categories
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Catalog - Categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: v1_catalog_categories_create
      description: "\n        Create a new product category.\n\n        Category names
        must be unique, regardless of letter casing.\n\n        This operation is
        available to administrators and stock managers.\n        "
      summary: Create Product Category
      tags:
      - Catalog - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/catalog/categories/{id}/:
    get:
      operationId: v1_catalog_categories_retrieve
      description: "\n        Retrieve the details of a specific product category\n
        \       using its unique identifier.\n        "
      summary: Retrieve Category Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - Catalog - Categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: v1_catalog_categories_partial_update
      description: "\n        Partially update an existing product category.\n\n        Only
        the fields included in the request are modified.\n\n        This operation
        is available to administrators and stock managers.\n        "
      summary: Update Product Category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - Catalog - Categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: v1_catalog_categories_destroy
      description: "\n        Permanently delete a product category.\n\n        Only
        administrators can perform this operation.\n\n        A category cannot be
        deleted if it is associated with existing\n        products. In that case,
        the API returns HTTP 409 Conflict.\n        "
      summary: Delete Product Category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - Catalog - Categories
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/catalog/products/:
    get:
      operationId: v1_catalog_products_list
      description: "\n        Retrieve a paginated list of products registered in
        the catalog.\n\n        Available query parameters:\n\n        - search: Search
        products by SKU or name.\n        - category: Filter products by category
        ID.\n        - is_active: Filter products by active status.\n        - ordering:
        Order results by unit_price or name.\n\n        All authenticated and active
        users can access this endpoint.\n        "
      summary: List Products
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - in: query
        name: category_name
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: number
      - in: query
        name: price_min
        schema:
          type: number
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Catalog - Products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: v1_catalog_products_create
      description: "\n        Create a new product in the catalog.\n\n        Each
        product must have a unique SKU, a name, a category,\n        and a non-negative
        unit price.\n\n        The SKU is case-insensitive and must be unique.\n\n
        \       This operation is available to administrators and stock managers.\n
        \       "
      summary: Create Product
      tags:
      - Catalog - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/catalog/products/{id}/:
    get:
      operationId: v1_catalog_products_retrieve
      description: "\n        Retrieve detailed information about a specific product.\n\n
        \       The response includes product information and its associated category.\n
        \       "
      summary: Retrieve Product Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - Catalog - Products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: v1_catalog_products_partial_update
      description: "\n        Partially update an existing product.\n\n        Only
        the fields included in the request are modified.\n\n        This operation
        is available to administrators and stock managers.\n        "
      summary: Update Product
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - Catalog - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/catalog/products/{id}/deactivate/:
    post:
      operationId: v1_catalog_products_deactivate_create
      description: "\n        Deactivate a product without permanently deleting it.\n\n
        \       The product remains stored in the database, preserving its\n        historical
        references.\n\n        This operation is idempotent.\n\n        Returns HTTP
        200 with the updated product information.\n        "
      summary: Deactivate Product
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this product.
        required: true
      tags:
      - Catalog - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/v1/inventory/stock-adjustments/:
    post:
      operationId: v1_inventory_stock_adjustments_create
      description: "\n        Manually adjust the physical stock quantity\n        of
        a product in a specific warehouse.\n\n        Required fields:\n\n        -
        product: Product identifier.\n        - warehouse: Warehouse identifier.\n
        \       - quantity_delta: Positive or negative quantity.\n        - reason:
        Mandatory explanation for the adjustment.\n\n        Business rules:\n\n        -
        The adjustment quantity cannot be zero.\n        - A reason is required.\n
        \       - Physical stock cannot become negative.\n        - Reserved stock
        cannot exceed physical stock.\n        - Every successful adjustment creates
        an immutable stock movement.\n\n        Only administrators and stock managers
        can perform this operation.\n        "
      summary: Adjust Stock Quantity
      tags:
      - Inventory - Stock Adjustments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockAdjustmentInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockAdjustmentInput'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovement'
          description: ''
        '400':
          description: Invalid request data.
        '401':
          description: Authentication required.
        '403':
          description: Insufficient permissions.
        '409':
          description: Business rule violation or insufficient stock.
  /api/v1/inventory/stock-levels/:
    get:
      operationId: v1_inventory_stock_levels_list
      description: "\n        Retrieve a paginated list of stock levels.\n\n        Each
        stock level represents the quantity of a product\n        stored in a specific
        warehouse.\n\n        Available query parameters:\n\n        - product: Filter
        by product ID.\n        - warehouse: Filter by warehouse ID.\n        - low_stock:
        Return stock levels below a threshold.\n        - threshold: Maximum available
        quantity for low-stock filtering.\n\n        Available stock is calculated
        as:\n\n        available = on_hand - reserved.\n\n        All authenticated
        and active users can access this endpoint.\n        "
      summary: List Stock Levels
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Inventory - Stock Levels
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStockLevelList'
          description: ''
  /api/v1/inventory/stock-levels/{id}/:
    get:
      operationId: v1_inventory_stock_levels_retrieve
      description: "\n        Retrieve the stock level of a specific product\n        in
        a specific warehouse.\n\n        The response includes physical, reserved
        and available quantities.\n        "
      summary: Retrieve Stock Level Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this stock level.
        required: true
      tags:
      - Inventory - Stock Levels
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLevel'
          description: ''
  /api/v1/inventory/stock-movements/:
    get:
      operationId: v1_inventory_stock_movements_list
      description: "\n        Retrieve the history of stock movements.\n\n        Supported
        movement types:\n\n        - RECEIPT: Increase physical stock.\n        -
        SHIPMENT: Decrease physical and reserved stock.\n        - RESERVE: Increase
        reserved stock.\n        - RELEASE: Decrease reserved stock.\n        - ADJUSTMENT:
        Correct physical stock.\n\n        Available query parameters:\n\n        -
        product: Filter by product ID.\n        - warehouse: Filter by warehouse ID.\n
        \       - movement_type: Filter by movement type.\n        - created_at__gte:
        Filter by creation date.\n\n        Stock movements are immutable.\n\n        All
        authenticated and active users can access this endpoint.\n        "
      summary: List Stock Movements
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Inventory - Stock Movements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStockMovementList'
          description: ''
  /api/v1/inventory/stock-movements/{id}/:
    get:
      operationId: v1_inventory_stock_movements_retrieve
      description: "\n        Retrieve the details of a specific stock movement.\n\n
        \       This endpoint is read-only.\n        "
      summary: Retrieve Stock Movement Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this stock movement.
        required: true
      tags:
      - Inventory - Stock Movements
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovement'
          description: ''
  /api/v1/inventory/warehouses/:
    get:
      operationId: v1_inventory_warehouses_list
      description: "\n        Retrieve a list of all registered warehouses.\n\n        Only
        authenticated and active users can access this endpoint.\n        "
      summary: List Warehouses
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Inventory - Warehouses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWarehouseList'
          description: ''
    post:
      operationId: v1_inventory_warehouses_create
      description: "\n        Create a new warehouse.\n\n        Warehouse codes must
        be unique.\n\n        This operation is available to administrators\n        and
        stock managers.\n        "
      summary: Create Warehouse
      tags:
      - Inventory - Warehouses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Warehouse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Warehouse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Warehouse'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
  /api/v1/inventory/warehouses/{id}/:
    get:
      operationId: v1_inventory_warehouses_retrieve
      description: "\n        Retrieve the details of a specific warehouse\n        using
        its unique identifier.\n        "
      summary: Retrieve Warehouse Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this warehouse.
        required: true
      tags:
      - Inventory - Warehouses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
    patch:
      operationId: v1_inventory_warehouses_partial_update
      description: "\n        Partially update an existing warehouse.\n\n        Only
        the fields included in the request are modified.\n\n        This operation
        is available to administrators\n        and stock managers.\n        "
      summary: Update Warehouse
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this warehouse.
        required: true
      tags:
      - Inventory - Warehouses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWarehouse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWarehouse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWarehouse'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
  /api/v1/partners/customers/:
    get:
      operationId: v1_partners_customers_list
      description: "\n        Retrieve a paginated list of customers registered in
        the system.\n\n        Query parameters:\n        - search: Search customers
        by name, email, or phone number.\n        - is_active: Filter customers by
        active status.\n        - ordering: Order results by name or creation date.\n\n
        \       All authenticated and active users can access this endpoint.\n        "
      summary: List Customers
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Partners - Customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerList'
          description: ''
    post:
      operationId: v1_partners_customers_create
      description: "\n        Register a new customer in the system.\n\n        The
        request must include the required customer information,\n        such as name
        and contact details.\n\n        This operation is available to administrators
        and sales users.\n        "
      summary: Create Customer
      tags:
      - Partners - Customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Customer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Customer'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
  /api/v1/partners/customers/{id}/:
    get:
      operationId: v1_partners_customers_retrieve
      description: "\n        Retrieve the complete information of a specific customer\n
        \       using their unique identifier.\n        "
      summary: Retrieve Customer Details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this customer.
        required: true
      tags:
      - Partners - Customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
          description: ''
    put:
      operationId: v1_partners_customers_update
